---
stages:
  - test
  - build
  - deploy

# Test Stage
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore Gateway.Tests/Gateway.Tests.csproj
    - dotnet build Gateway.Tests/Gateway.Tests.csproj
    - dotnet test Gateway.Tests/Gateway.Tests.csproj
  only:
    - dev

# Build Stage
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build --build-arg PUCHOVER_USER_KEY=${PUCHOVER_USER_KEY} --build-arg PUSHOVER_TOKEN_GATEWAY=${PUSHOVER_TOKEN} -t registry.gitlab.com/tpvdb/tpvdb/gateway .
    - docker push registry.gitlab.com/tpvdb/tpvdb/gateway
  only:
    - dev

deploy:
  stage: deploy
  script:
    - echo "User $(whoami)"
    - kubectl get pods
    - kubectl set image deployment/gateway-deployment gateway=registry.gitlab.com/tpvdb/tpvdb/gateway --record
    - kubectl rollout restart deployment/gateway-deployment
  only:
    - dev