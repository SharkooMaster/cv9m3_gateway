syntax = "proto3";

import "google/protobuf/empty.proto";

service StoreVector
{
    rpc Store (StoreVector_Req) returns (StoreVector_Res);
}

message StoreVector_Req
{
    string bitstring = 1;
    repeated float vector = 2;
    bytes chunk = 3;
    string targetIp = 4;
    string headRouteID = 5;
}

message StoreVector_Res
{
    uint64 id = 1;
    uint64 index = 2;
    string storage_guid = 3;  // SHA256 of chunk bytes — content-addressable, globally unique
    bool failed = 4;          // true = failure. Default false = success/dedup. Inverted from "success" so the proto3 default for a missing field is treated as success (backward-compat with older versions).
}
